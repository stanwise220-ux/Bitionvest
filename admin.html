<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitionInvest Admin Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
display:none;
background:#0D1117;
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#161B22;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
text-align:center;
color:#FFD700;
margin-bottom:25px;
}

.card{
background:#1E242C;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

.card h3{
margin-bottom:15px;
color:#FFD700;
}

input,
textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:#0D1117;
color:white;
font-size:15px;
outline:none;
}

textarea{
min-height:120px;
resize:vertical;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}

#updateBtn{
background:#FFD700;
color:black;
}

#announcementBtn{
background:#009688;
color:white;
}

#logoutBtn{
background:#c62828;
color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>BitionInvest Admin Portal</h1>

<div class="card">

<h3>Update User Account</h3>

<input
type="email"
id="userEmail"
placeholder="User Email">

<input
type="number"
id="balance"
placeholder="Demo Balance">

<input
type="number"
id="profit"
placeholder="Demo Profit">

<button id="updateBtn">
Update User
</button>

</div>

<div class="card">

<h3>Platform Announcement</h3>

<textarea
id="announcement"
placeholder="Write announcement here..."></textarea>

<button id="announcementBtn">
Publish Announcement
</button>

</div>

<button id="logoutBtn">
Logout
</button>

</div>

<script type="module" src="js/js/admin.js"></script>

</body>
</html>
