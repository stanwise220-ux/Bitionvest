<!DOCTYPE html>
<html lang="en">
<head>

<title>BitionInvest Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

<div class="container">

<input type="text" id="uid" placeholder="User UID">

Update User
</button>
