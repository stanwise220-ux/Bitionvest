<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitionInvest Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0D1117;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:90%;
max-width:400px;
background:#161B22;
padding:30px;
border-radius:12px;
}

h2{
color:#FFD700;
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:8px;
background:#222;
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
margin-bottom:10px;
font-size:16px;
cursor:pointer;
}

#loginBtn{
background:#FFD700;
color:black;
}

#signupBtn{
background:#333;
color:white;
}

#googleBtn{
background:white;
color:black;
}

a{
display:block;
text-align:center;
margin-top:10px;
color:#FFD700;
text-decoration:none;
}
</style>

</head>

<body>

<div class="login-box">

<h2>BitionInvest</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

<button id="signupBtn">Create Account</button>

<button id="googleBtn">Continue with Google</button>

<a href="index.html">← Back to Home</a>

</div>
  
<script type="module" src="js/auth.js"></script>
  
</body>
</html>
